<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Drawn on the 16 px grid: straight edges sit on whole pixels so the
       icon stays sharp in the top bar. -->
  <g fill="#bebebe">
    <!-- near curtain, the wing we watch from -->
    <path d="M1 1 H5 C4.4 5 5.4 9 4.6 13 H1 Z"/>
    <!-- light pipe and beam -->
    <rect x="7" y="1" width="8" height="1"/>
    <path d="M9 2 H11 L14 13 H8 Z" opacity="0.35"/>
    <!-- performer -->
    <circle cx="10.5" cy="5.5" r="1.5"/>
    <path d="M9 9 Q9 8 10 8 H11 Q12 8 12 9 V13 H9 Z"/>
    <!-- stage floor -->
    <rect x="1" y="14" width="14" height="1"/>
  </g>
</svg>
