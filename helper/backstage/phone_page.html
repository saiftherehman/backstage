<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Backstage</title>
<style>
  :root {
    --bg: #111111;
    --surface: #1c1c1c;
    --line: #2a2a2a;
    --text: #f2f2f2;
    --muted: #a8a8a8;
    --dim: #5c5c5c;
    --accent: #f5b83d;
    --rec: #ff453a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0 14px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--rec); }
  #status { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timer { color: var(--muted); font-variant-numeric: tabular-nums; }
  #link { font-size: 12px; color: var(--muted); }
  #link.off { color: var(--rec); }
  section { padding: 16px 0; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #question { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  #answer { font-size: 19px; white-space: pre-wrap; margin: 0; }
  #answer.thinking { color: var(--muted); }
  button {
    margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #111111; font: 600 16px system-ui, sans-serif;
  }
  button:active { opacity: .8; }
  .current { font-size: 24px; font-weight: 600; color: var(--accent); margin: 0 0 6px; }
  .next { font-size: 18px; color: #d0d0d0; margin: 0 0 4px; }
  .empty { color: var(--muted); font-size: 14px; }
  #transcript p { margin: 0 0 6px; font-size: 15px; color: #d0d0d0; }
  #transcript b { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span id="status">Connecting...</span>
    <span id="timer"></span>
  </header>
  <div id="link">Not connected yet</div>

  <section>
    <h2>Assistant</h2>
    <p id="question">Start an assistant session on the laptop. Screen analysis shows up here.</p>
    <p id="answer"></p>
    <button id="ask">Analyse now</button>
  </section>

  <section>
    <h2>Teleprompter</h2>
    <div id="prompter"><p class="empty">No script loaded.</p></div>
  </section>

  <section>
    <h2>Transcript</h2>
    <div id="transcript"><p class="empty">Nothing yet.</p></div>
  </section>

<script>
  const key = new URLSearchParams(location.search).get("key") || "";
  const $ = id => document.getElementById(id);
  const NEXT_LINES = 3, TRANSCRIPT_LINES = 8;
  let state = {}, line = 0, transcript = [];

  function renderState() {
    $("dot").classList.toggle("on", !!state.active);
    $("status").textContent = state.active ? state.title : (state.status || "No session running");
    renderPrompter();
  }

  function renderPrompter() {
    const lines = state.script_lines || [];
    const box = $("prompter");
    box.replaceChildren();
    if (!lines.length) {
      box.innerHTML = '<p class="empty">No script loaded.</p>';
      return;
    }
    lines.slice(line, line + 1 + NEXT_LINES).forEach((text, i) => {
      const p = document.createElement("p");
      p.className = i === 0 ? "current" : "next";
      p.textContent = text || " ";
      box.append(p);
    });
  }

  function addTranscript(speaker, text) {
    transcript = [...transcript, [speaker, text]].slice(-TRANSCRIPT_LINES);
    const box = $("transcript");
    box.replaceChildren(...transcript.map(([s, t]) => {
      const p = document.createElement("p");
      const who = document.createElement("b");
      who.textContent = (s === "me" ? "Me" : "Them") + ": ";
      p.append(who, t);
      return p;
    }));
  }

  const clock = () => new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});

  // The last answer stays readable while the next one is worked on.
  function showUpdating(reason) {
    $("question").textContent = `Updating (${reason})...`;
  }

  function showAnswer(reason, answer) {
    $("question").textContent = `Updated ${clock()}, ${reason}`;
    $("answer").textContent = answer;
    $("answer").classList.remove("thinking");
    if (navigator.vibrate) navigator.vibrate(60);
  }

  function showError(message) {
    $("question").textContent = message;
  }

  function tick() {
    if (!state.active) { $("timer").textContent = ""; return; }
    const s = Math.max(0, Math.floor(Date.now() / 1000 - state.started));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, "0");
    $("timer").textContent = h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
  }
  setInterval(tick, 1000);

  const handlers = {
    state: e => { state = e.state; renderState(); },
    prompter: e => { line = e.line; renderPrompter(); },
    transcript: e => addTranscript(e.speaker, e.text),
    thinking: e => showUpdating(e.question),
    answer: e => showAnswer(e.question, e.answer),
    error: e => showError(e.message),
  };

  function connect() {
    const events = new EventSource(`/events?key=${encodeURIComponent(key)}`);
    events.onopen = () => { $("link").textContent = "Connected to your laptop"; $("link").className = ""; };
    events.onmessage = m => { const e = JSON.parse(m.data); handlers[e.type]?.(e); };
    events.onerror = () => { $("link").textContent = "Connection lost, retrying..."; $("link").className = "off"; };
  }
  connect();

  $("ask").onclick = () => fetch(`/ask?key=${encodeURIComponent(key)}`, {method: "POST"});
</script>
</body>
</html>
